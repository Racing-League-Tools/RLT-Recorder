name = "rlt-recorder"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Served only on the custom domain the recorder has built in, not on workers.dev.
workers_dev = false
routes = [
  { pattern = "@DOMAIN@", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "rlt-recorder"
database_id = "@DATABASE_ID@"
